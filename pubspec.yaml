name: fpj_core
description: "MsrJie的Flutter封装基础库"
version: 0.0.1
homepage: "https://gitee.com/msr_jie/fpj_core"

environment:
  sdk: ^3.5.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  get: ^4.6.6
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
#  google_fonts:
  logger: ^2.5.0
  pretty_qr_code: ^3.3.0
  get_storage: ^2.1.1
  oktoast: ^3.4.0
  lifecycle: ^0.9.0
  pull_to_refresh_flutter3: ^2.0.2
  palette_generator: ^0.3.3+5
  badges: ^3.1.2
  freezed_annotation: ^2.4.4   # https://github.com/rrousselGit/freezed/blob/master/resources/translations/zh_CN/README.md
  json_annotation: ^4.9.0
  common_utils: ^2.1.0
  clipboard: ^0.1.3
  flutter_svg: ^2.0.17
  path_provider: ^2.1.5

